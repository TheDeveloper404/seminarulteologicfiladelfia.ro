name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholder — build-ul are nevoie de o valoare validă la parse time, nu se conectează
      # efectiv la nicio bază de date reală în acest job.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Istoric complet, altfel gitleaks vede doar HEAD.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      # nu "npm ci": e strict la potrivirea exactă cu versiunea de npm care a generat
      # lockfile-ul (poate diferi de npm-ul mașinii de dev) — a picat CI-ul din cauza asta.
      - run: npm install

      - run: npm run lint

      - run: npm run test

      - run: npm run build
